<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>N2 Japanese Study</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <!-- Bootstrap 5 CSS (chỉ cần cho modal đẹp) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">N2 Japanese Study</a>
      <div>
        <ul class="navbar-nav me-auto mb-2 mb-lg-0" style="flex-direction: row;">
          <li class="nav-item"><a class="nav-link active" id="tabKanji" href="#">Kanji</a></li>
          <li class="nav-item"><a class="nav-link" id="tabGrammar" href="#">Ngữ pháp</a></li>
          <li class="nav-item"><a class="nav-link" id="tabQuizlet" href="#">Quizlet</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Icon random Kanji (chỉ hiện khi ở tab Kanji) -->
  <div id="randomKanjiBtn" title="Xáo trộn Kanji"
	  style="position: fixed; bottom: 30px; right: 30px; z-index: 1200;
			 background: #fff; color: #43a047; box-shadow: 0 4px 18px #ddeaff88;
			 border-radius: 50%; width: 58px; height: 58px; display: flex;
			 align-items: center; justify-content: center; font-size: 2.1em;
			 cursor: pointer; transition: box-shadow .18s, transform .18s;">
	  <span style="user-select: none;">🎲</span>
  </div>

  <div class="container mt-3">
    <div id="main-content"></div>
  </div>

  <!-- Modal Kanji -->
  <div class="modal fade" id="kanjiModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" id="kanjiModalContent"></div>
    </div>
  </div>
  <!-- Modal Grammar (sample, chưa code chi tiết) -->
  <div class="modal fade" id="grammarModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" id="grammarModalContent"></div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="kanji_n2.js"></script>
  <script src="grammar_mimikara_n2.js"></script>
  <script src="main.js"></script>
</body>
</html>
